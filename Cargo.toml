[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/gui"]
# `cargo build` / `cargo run` default to the CLI. The GUI pulls in the whole
# egui/wgpu stack, so it is opt-in: `cargo run -p mul-tor-gui`.
default-members = ["crates/core", "crates/cli"]

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2024"
# Verified: `cargo +1.89.0 check -p mul-tor-core -p mul-tor`. The GUI needs more (see its manifest).
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Official-Husko/mul-tor"
authors = ["Official-Husko"]

[workspace.dependencies]
mul-tor-core = { path = "crates/core" }

anyhow = "1"
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
console = "0.16"
dialoguer = "0.12"
directories = "6"
futures = "0.3"
indicatif = "0.18"
md-5 = "0.11"
rand = "0.10"
regex = "1"
# `rustls-no-provider` + an explicit `ring` provider (installed in `HttpFactory`)
# keeps the build free of aws-lc's C/CMake toolchain, which makes static and
# cross-compiled CLI binaries much less painful.
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "http2",
    "charset",
    "multipart",
    "stream",
    "form",
    "query",
    "json",
    "cookies",
    "socks",
    "system-proxy",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

# dev-only
axum = { version = "0.8", features = ["multipart"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
