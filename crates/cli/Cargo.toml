[package]
name = "mul-tor"
description = "Upload files to many hosting providers at once (command-line interface)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Lets the integration tests point every provider at a local mock server through
# the MUL_TOR_TEST_BASE_URL environment variable. Never enabled in releases.
test-hooks = []

[[bin]]
name = "mul-tor"
path = "src/main.rs"

[dependencies]
mul-tor-core.workspace = true
anyhow.workspace = true
clap.workspace = true
console.workspace = true
dialoguer.workspace = true
directories.workspace = true
indicatif.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
toml.workspace = true

[dev-dependencies]
async-trait.workspace = true
axum.workspace = true
tempfile.workspace = true
