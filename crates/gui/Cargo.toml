[package]
name = "mul-tor-gui"
description = "Upload files to many hosting sites at once (graphical interface)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "mul-tor-gui"
path = "src/main.rs"

[dependencies]
mul-tor-core.workspace = true
eframe = { version = "0.37", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts", "clipboard"] }
egui = "0.37"
rfd = "0.17"
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
