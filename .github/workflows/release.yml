name: Release

# Runs when a version tag is pushed (both `1.2.3` and `v1.2.3` spellings have
# been used in this repository). Builds the command-line and graphical
# programs for each platform and attaches them to a GitHub release.
on:
  push:
    tags: ["v[0-9]*", "[0-9]*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, gui: true }
          # Fully static command-line build. The GUI loads graphics libraries
          # at run time, which a static musl binary cannot do, so it is gnu-only.
          - { name: linux-x86_64-static, os: ubuntu-latest, target: x86_64-unknown-linux-musl, gui: false, musl: true }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, gui: true }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, gui: true }
          - { name: macos-aarch64, os: macos-latest, target: aarch64-apple-darwin, gui: true }
          - { name: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin, gui: true }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install the musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        shell: bash
        run: |
          packages="-p mul-tor"
          if [ "${{ matrix.gui }}" = "true" ]; then packages="$packages -p mul-tor-gui"; fi
          cargo build --release --locked --target ${{ matrix.target }} $packages

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then version="dev-${GITHUB_SHA::7}"; fi
          name="mul-tor-${version}-${{ matrix.name }}"
          mkdir -p "dist/$name"
          bin="target/${{ matrix.target }}/release"
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          cp "$bin/mul-tor$ext" "dist/$name/"
          if [ "${{ matrix.gui }}" = "true" ]; then cp "$bin/mul-tor-gui$ext" "dist/$name/"; fi
          cp README.md LICENSE "dist/$name/"
          cp -r presets "dist/$name/presets"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: mul-tor-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # A tag with a suffix (2.1.0-rc.1) is a pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
